# Spring Data Source
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable the H2 console
spring.h2.console.enabled=true

# JPA / Hibernate
# We disable Hibernate's automatic DDL generation since Flyway is handling it.
spring.jpa.hibernate.ddl-auto=none

# Flyway
# Flyway is enabled by default when the starter is on the classpath.
# You can disable it with the property below if needed.
# spring.flyway.enabled=true
